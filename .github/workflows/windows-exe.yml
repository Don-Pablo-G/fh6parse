# Tests on every push. Windows one-file exe + GitHub Release on tag vX.Y.Z.
# Office PCs then show yellow UPDATE (frozen exe compares asset version).
# Tag must match fh6parse/_version.py and pyproject.toml (no silent republish of the same number).
name: Windows exe

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests -q

  windows-exe:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CAD extra + PyInstaller)
        run: python -m pip install -e ".[models]" pyinstaller
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os
          import sys
          from fh6parse._version import __version__
          from fh6parse.update import release_tag_version

          tag = os.environ.get("GITHUB_REF_NAME", "")
          got = release_tag_version(tag)
          if got != __version__:
              sys.stderr.write(
                  f"tag {tag} does not match package {__version__} — "
                  "bump fh6parse/_version.py and pyproject.toml before tagging\n"
              )
              sys.exit(1)
          print(f"tag {tag} matches {__version__}")
      - name: Tests
        run: python -m unittest discover -s tests -q
      - name: Build one-file exe
        run: cmd /c packaging\build_windows.bat
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fh6parse-windows-x64
          path: dist/packages/fh6parse-*-windows-x64.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Ver = python -c "from fh6parse._version import __version__; print(__version__)"
          $Stamp = python -c "from fh6parse._version import package_stamp; print(package_stamp())"
          if (-not $Ver) { throw "could not read package version" }
          if (-not $Stamp) { throw "could not read package stamp" }
          $Stamped = Join-Path $PWD "dist\packages\fh6parse-$Stamp-windows-x64.exe"
          $Plain = Join-Path $PWD "dist\packages\fh6parse-$Ver-windows-x64.exe"
          if (-not (Test-Path $Stamped)) { throw "missing $Stamped" }
          if (-not (Test-Path $Plain)) { Copy-Item -Force $Stamped $Plain }
          $Uploads = @($Stamped)
          if ((Resolve-Path $Stamped).Path -ne (Resolve-Path $Plain).Path) {
            $Uploads += $Plain
          }
          $Tag = $env:GITHUB_REF_NAME
          $Notes = "Windows office GUI $Stamp. On the PC: yellow UPDATE downloads this exe and restarts. Keep fh6parse-kiosk.ini next to the exe (STEP folders, language)."
          $exists = $false
          $prev = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view $Tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          $ErrorActionPreference = $prev
          if ($exists) {
            Write-Host "Uploading to existing $Tag"
            gh release upload $Tag @Uploads --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            Write-Host "Creating $Tag"
            gh release create $Tag @Uploads --title "fh6parse $Stamp" --notes $Notes --repo $env:GITHUB_REPOSITORY
          }
          Write-Host "Published $($Uploads -join ', ') as $Tag"
